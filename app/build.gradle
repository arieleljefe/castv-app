plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// [UPDATE-1] versionCode y versionName los pone el workflow (CASTV_VERSION_CODE = número de ejecución,
// CASTV_VERSION_NAME = etiqueta sin la "v"). En local se usan los valores por defecto.
def castvVc = System.getenv("CASTV_VERSION_CODE")
def castvVersionCode = (castvVc && castvVc.isInteger()) ? castvVc.toInteger() : 3
def castvVn = System.getenv("CASTV_VERSION_NAME")
def castvVersionName = castvVn ? castvVn : "3.8"   // [VERSION-3] valor para compilar sin etiqueta; con etiqueta v* manda la etiqueta

android {
    namespace 'com.castv.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.castv.app"
        minSdk 24
        targetSdk 34
        versionCode castvVersionCode
        versionName castvVersionName
        // [ACERCA-1] fecha de compilación para la pantalla "Acerca de"
        buildConfigField "String", "BUILD_DATE", "\"${new Date().format('yyyy-MM-dd', TimeZone.getTimeZone('UTC'))}\""

        // [IA-2a] Whisper (código nativo): solo ARM de 64 bits
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    // [IA-2a] compilar el código nativo de src/main/cpp
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // [FIRMA-1] clave de firma estable: sale de variables de entorno (GitHub Secrets).
    // Nunca hay claves dentro del repo. Sin variables, se usa la clave debug (solo pruebas).
    signingConfigs {
        release {
            def ksPath = System.getenv("CASTV_KEYSTORE")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("CASTV_STORE_PASSWORD")
                keyAlias System.getenv("CASTV_KEY_ALIAS")
                keyPassword System.getenv("CASTV_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("CASTV_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true   // [ACERCA-1]
    }
    // [TESTS-1] pruebas unitarias en el ordenador (sin Android): las llamadas a android.* devuelven valores vacíos
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.5.3'   // [QR-1] dibujar el código QR
    testImplementation 'junit:junit:4.13.2'   // [TESTS-1]
    testImplementation 'org.json:json:20231013'   // [TESTS-2] JSON real en las pruebas (el de Android viene vacío)
}
