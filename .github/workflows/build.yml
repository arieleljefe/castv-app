name: Build CASTV APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KS_STOREPASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'   # [CACHE-1] guarda las dependencias entre builds (evita el error 429)

      - name: Configurar Android SDK y Licencias
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fb8" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" >> /usr/local/lib/android/sdk/licenses/android-sdk-license

      - name: Instalar NDK y CMake para Whisper (IA-2a)
        run: |
          SDKM=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;25.1.8937393" "cmake;3.22.1"

      - name: Exigir clave de firma en las etiquetas (FIRMA-1)
        if: startsWith(github.ref, 'refs/tags/') && env.KS_B64 == ''
        run: |
          echo "Faltan los secretos de firma: un Release sin la clave estable no se podria actualizar."
          exit 1

      - name: Preparar clave de firma (FIRMA-1)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/castv-release.jks"
          echo "CASTV_KEYSTORE=$RUNNER_TEMP/castv-release.jks" >> $GITHUB_ENV
          echo "CASTV_KEY_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
          echo "CASTV_KEY_PASSWORD=$KS_KEYPASS" >> $GITHUB_ENV
          echo "CASTV_STORE_PASSWORD=$KS_STOREPASS" >> $GITHUB_ENV

      - name: Número de versión (UPDATE-1)
        run: |
          echo "CASTV_VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "CASTV_VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          fi

      - name: Pruebas automaticas (TESTS-1)
        # Si una prueba falla, el build se detiene antes de compilar el APK.
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK con Stacktrace
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --stacktrace

      - name: Mostrar huella de la firma (FIRMA-1)
        run: |
          APKSIGNER=$(ls /usr/local/lib/android/sdk/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "certificate SHA-256|Verified" || true
          if [ -z "$KS_B64" ]; then echo "AVISO: sin clave estable, APK firmado con clave debug (solo pruebas)"; fi

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: castv-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Preparar APK para el Release
        if: startsWith(github.ref, 'refs/tags/')
        run: cp app/build/outputs/apk/release/app-release.apk "CASTV-${{ github.ref_name }}.apk"

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CASTV-${{ github.ref_name }}.apk
          generate_release_notes: true
